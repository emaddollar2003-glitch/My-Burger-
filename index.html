<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيرة الذاتية - عماد</title>
    <link rel="stylesheet" href="style.css">
    <!-- استيراد أيقونات جاهزة من FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card">
        <!-- الترويسة والتعريف -->
        <header>
            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <h1>عماد</h1>
            <p class="title">مطور برمجيات | صانع محتوى رقمي</p>
            <p class="bio">مطور شغوف ببناء تطبيقات الويب والمحتوى الرقمي التفاعلي وتقديم حلول تقنية عصرية.</p>
        </header>

        <!-- زر تحميل الـ CV -->
        <section class="download-section">
            <a href="cv.pdf" download class="btn download-btn">
                <i class="fa-solid fa-file-arrow-down"></i> تحميل السيرة الذاتية (PDF)
            </a>
        </section>

        <!-- أبرز الأعمال والمقترحات -->
        <section id="projects">
            <h2><i class="fa-solid fa-briefcase"></i> أبرز أعمالي ومقترحاتي</h2>
            <div class="project-list">
                <a href="#" target="_blank" class="project-item">
                    <span>منصة المطاعم الذكية</span>
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <a href="#" target="_blank" class="project-item">
                    <span>تطبيق الطلبات الإلكتروني</span>
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
            </div>
        </section>

        <!-- أزرار التواصل المباشر -->
        <section id="contact">
            <h2><i class="fa-solid fa-address-book"></i> تواصل معي</h2>
            <div class="btn-container">
                <a href="https://wa.me/970XXXXXXXXX" target="_blank" class="btn whatsapp">
                    <i class="fa-brands fa-whatsapp"></i> واتساب
                </a>
                <a href="tel:+970XXXXXXXXX" class="btn call">
                    <i class="fa-solid fa-phone"></i> اتصال هاتفي
                </a>
                <a href="https://github.com/YourUsername" target="_blank" class="btn github">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
        </section>

        <footer>
            <p>© 2026 عماد. جميع الحقوق محفوظة.</p>
        </footer>
    </div>

</body>
</html>
